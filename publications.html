<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Publications · Amirul Islam</title>
  <meta name="description" content="Journal articles, conference papers and IEEE 802 standardization contributions by Dr. Amirul Islam.">
  <meta name="author" content="Amirul Islam">
  <meta property="og:title" content="Publications · Amirul Islam">
  <meta property="og:description" content="Journal articles, conference papers and IEEE 802 standardization contributions by Dr. Amirul Islam.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/amirul.jpg">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="publications">
  <div id="site-header"></div>

  <main id="main">
    <section class="pagehead">
      <div class="wrap pagehead__grid">
        <div>
          <p class="eyebrow">Publications</p>
          <h1>Peer-reviewed research output.</h1>
          <p>Journal articles, conference papers and IEEE 802 standardization contributions. Full citation metrics are on <a class="text-link" href="https://scholar.google.com/citations?user=uX5PG0AAAAAJ&amp;hl=en" target="_blank" rel="noopener">Google Scholar ↗</a></p>
        </div>
        <div class="pubstats" id="pubStats" aria-label="Publication summary"></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="pubtools">
          <div class="pubfilters" id="pubFilters">
            <div class="fgroup">
              <button class="fbtn" data-filter="type:all">All</button>
              <button class="fbtn" data-filter="type:journal">Journals</button>
              <button class="fbtn" data-filter="type:conference">Conferences</button>
              <button class="fbtn" data-filter="type:standard">IEEE 802</button>
            </div>
            <div class="fgroup">
              <button class="fbtn" data-filter="only:all">Any</button>
              <button class="fbtn" data-filter="only:q1">Q1 only</button>
              <button class="fbtn" data-filter="only:first">First author</button>
            </div>
          </div>
          <input type="search" class="pubsearch" id="pubSearch" placeholder="Search title, venue, author…" aria-label="Search publications">
        </div>
        <p class="pubcount">Showing <span id="pubCount"></span></p>
        <ul class="publist" id="allPubs"></ul>
        <p id="pubEmpty">No publications match those filters.</p>
        <nav class="pagination" id="pubPager" aria-label="Publication pages"></nav>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
